<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моды для GTA SA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>

  <header class="header">
    <div class="header-top">
      <div class="logo">
        <span class="logo-icon">🚗</span>
        <span class="logo-text">Моды для GTA SA</span>
      </div>
      <div class="auth-box" id="authBox"></div>
    </div>
    <p class="subtitle">Твоё личное хранилище модов и файлов</p>
  </header>

  <main class="container">
    <div class="search-box">
      <input type="text" id="search" placeholder="Поиск по модам...">
    </div>
    <div class="files-grid" id="filesGrid"></div>
    <p class="empty" id="empty" style="display:none;">Ничего не найдено 😕</p>
  </main>

  <footer class="footer">
    <p>© 2026 Моды для GTA SA · сделано с душой</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
